name: Build AAR
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execution permissions
        run: chmod +x gradlew

      - name: Cache Gradle Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build AAR
        run: ./gradlew :torrentstreamlibrary:assembleRelease --stacktrace

      - name: Upload AAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: torrentstreamlibrary-release
          path: torrentstreamlibrary/build/outputs/aar/torrentstreamlibrary-release.aar
